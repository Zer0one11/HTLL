<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL LIST</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="theme-dark">
    <div id="snow-container"></div>

    <div class="wrapper">
        <header>
            <div class="top-controls">
                <label class="switch">
                    <input type="checkbox" id="snow-toggle" checked>
                    <span class="slider round"></span>
                </label>
                <span class="control-label">SNOW</span>
            </div>

            <h1 class="main-title">TPLL LIST</h1>
            <a href="https://t.me/your_channel" target="_blank" class="official-link">OFFICIAL CHANNEL</a>

            <div class="list-selector">
                <button class="list-button" data-list="levels">TPLL</button>
                <button class="list-button" data-list="ppll">PPLL</button>
                <button class="list-button" data-list="sll">SLL</button>
                <button class="list-button" data-list="ill">ILL</button>
                <button class="list-button" data-list="inf">INF</button>
                <button class="list-button" data-list="scl">SCL</button>
                <button class="list-button" data-list="icl">ICL</button>
            </div>

            <div class="theme-selector">
                <button class="theme-button" data-theme="dark">DARK</button>
                <button class="theme-button" data-theme="light">LIGHT</button>
            </div>

            <div class="settings-panel">
                <div class="setting-item">
                    <label>SNOW SIZE</label>
                    <input type="range" id="snowSizeRange" min="2" max="20" value="5">
                </div>
                <div class="setting-item">
                    <label>OPACITY</label>
                    <input type="range" id="opacityRange" min="0.1" max="1.0" step="0.1" value="0.9">
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="levelSearch" placeholder="ПОИСК ПО НАЗВАНИЮ, ID ИЛИ АВТОРУ...">
            </div>
        </header>

        <main>
            <ul id="levelList">
                </ul>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
