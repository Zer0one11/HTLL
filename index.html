<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL List</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
</head>
<body class="theme-dark">
    <div id="snow-container"></div>

    <button id="open-request-btn" class="request-main-btn">ПОДАТЬ РЕКВЕСТ</button>

    <div class="snow-ui-static">
        <label class="snow-switch">
            <input type="checkbox" id="snow-toggle" checked>
            <span class="snow-slider"></span>
        </label>
        <span class="snow-text">СНЕГ</span>
        <div class="settings-container" style="position: relative; display: flex; align-items: center;">
            <img src="setting.ico" alt="⚙️" id="settings-btn" class="setting-icon" style="width:24px; cursor:pointer;">
            <div id="settings-menu" class="settings-menu" style="position:absolute; top:40px; right:0; background:rgba(0,0,0,0.8); padding:10px; border-radius:10px; display:none;">
                <div class="s-control"><span>SIZE</span><input type="range" id="snowSizeRange" min="2" max="25" value="5"></div>
                <div class="s-control"><span>OPACITY</span><input type="range" id="opacityRange" min="0.01" max="0.3" step="0.01" value="0.01"></div>
            </div>
        </div>
    </div>

    <header>
        <h1 class="main-title">TPLL LIST</h1>
        <div class="link-container"><a href="https://t.me/HardestTiktokLevelList" target="_blank" class="channel-link">КАНАЛ ЛИСТА</a></div>
        <div class="list-switcher">
            <button data-list="levels" class="list-button">TPLL</button>
            <button data-list="ppll" class="list-button">PPLL</button>
            <button data-list="sll" class="list-button">SLL</button>
            <button data-list="ill" class="list-button">ILL</button>
            <button data-list="inf" class="list-button">INF</button>
            <button data-list="scl" class="list-button">SCL</button>
            <button data-list="icl" class="list-button">ICL</button>
        </div>
        <div class="theme-switcher">
            <button data-theme="light" class="theme-button">Светлая</button>
            <button data-theme="dark" class="theme-button">Темная</button>
        </div>
    </header>

    <main><ul id="levelList" class="level-list"></ul></main>

    <div id="request-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="request-form-container">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="margin:0">NEW REQUEST</h2>
                    <span id="close-modal" style="cursor:pointer; font-size:1.5rem;">&times;</span>
                </div>
                <form id="request-form">
                    <input type="text" id="req-nickname" placeholder="Твой ник" required>
                    <input type="text" id="req-level-name" placeholder="Название уровня" required>
                    <input type="text" id="req-creator" placeholder="Автор уровня" required>
                    <input type="text" id="req-id" placeholder="ID уровня" required>
                    <input type="text" id="req-fps" placeholder="FPS (Latex)" required>
                    <input type="text" id="req-fv" placeholder="First Victor">
                    <input type="text" id="req-type" placeholder="Type">
                    <select id="req-list">
                        <option value="levels">TPLL</option><option value="ppll">PPLL</option>
                        <option value="sll">SLL</option><option value="ill">ILL</option>
                        <option value="inf">INF</option><option value="scl">SCL</option>
                        <option value="icl">ICL</option>
                    </select>
                    <textarea id="req-showcase" placeholder="Showcase Link" required></textarea>
                    <button type="submit" style="width:100%; padding:15px; border-radius:10px; border:none; background:#fff; color:#000; font-weight:900; cursor:pointer;">ОТПРАВИТЬ</button>
                </form>
            </div>
            <div id="chat-section" style="display:none;">
                <div id="chat-messages" style="height:200px; overflow-y:auto; margin-bottom:10px; border-bottom:1px solid #333;"></div>
                <div style="display:flex; gap:5px;"><input type="text" id="user-msg" placeholder="Message..."><button id="send-msg">></button></div>
            </div>
        </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getDatabase, ref, push, set, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
      const app = initializeApp({
        apiKey: "AIzaSyCuO6xuP2AP61bTbiqjho_jzXiDsCzxTCY",
        authDomain: "htll-request.firebaseapp.com",
        databaseURL: "https://htll-request-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "htll-request",
        appId: "1:400821777799:web:88da4772f63810f67e4f22"
      });
      window.db = getDatabase(app);
      window.dbRefs = { ref, push, set, onValue, onChildAdded };
    </script>
    <script src="script.js"></script>
</body>
</html>
