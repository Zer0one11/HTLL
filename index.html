<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL List</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="levels.css">
    <link rel="stylesheet" href="modals.css">
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
</head>
<body class="theme-dark">
    <div id="snow-container"></div>

    <button id="open-request-btn" class="request-main-btn">ПОДАТЬ РЕКВЕСТ</button>
    <button id="auth-main-btn" class="request-main-btn" style="left: auto; right: 20px; display: none;">РЕГИСТРАЦИЯ / ВХОД</button>
    <button id="settings-btn" class="settings-trigger">⚙</button>

    <div id="settings-menu" class="settings-panel">
        <div class="s-control">
            <span>Прозрачность панелей</span>
            <input type="range" min="0.01" max="1.0" step="0.05" value="0.01" oninput="applyOpacity(this.value)">
        </div>

        <div class="s-control">
            <label>
                <input type="checkbox" id="snow-toggle" onchange="toggleEffect('snow', this.checked)"> 
                СНЕГ (ВКЛ)
            </label>
            <input type="range" id="snow-range" min="1" max="15" value="5" oninput="updateSnowSize(this.value)">
            <span id="snow-size-val" class="size-indicator">5px</span>
        </div>

        <div class="s-control">
            <label>
                <input type="checkbox" id="sakura-toggle" onchange="toggleEffect('sakura', this.checked)"> 
                САКУРА (ВКЛ)
            </label>
            <input type="range" id="sakura-range" min="10" max="60" value="25" oninput="updateSakuraSize(this.value)">
            <span id="sakura-size-val" class="size-indicator">25px</span>
        </div>

        <div class="theme-switcher">
            <button class="theme-button" data-theme="dark">Dark</button>
            <button class="theme-button" data-theme="light">Light</button>
        </div>
    </div>

    <header>
        <h1 class="main-title">HTLL LIST</h1>
        <a href="https://t.me/yourchannel" class="channel-link">TELEGRAM CHANNEL</a>
    </header>

    <div class="list-switcher">
        <button class="list-button active-list" data-list="levels">Main List</button>
        <button class="list-button" data-list="ill">ILL</button>
        <button class="list-button" data-list="ppll">PPLL</button>
        <button class="list-button" data-list="tpll">TPLL</button>
    </div>

    <ul id="level-list" class="level-list">
        </ul>

    <div id="request-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="request-form-container">
                <h2>Подать запрос</h2>
                <form id="request-form">
                    <input type="text" id="req-nickname" placeholder="ВАШ НИК" required>
                    <input type="text" id="req-level-name" placeholder="НАЗВАНИЕ УРОВНЯ" required>
                    <input type="text" id="req-creator" placeholder="АВТОР" required>
                    <input type="text" id="req-id" placeholder="ID УРОВНЯ" required>
                    <input type="text" id="req-fps" placeholder="FPS (например, 360)" required>
                    <input type="text" id="req-fv" placeholder="BOTTER (если есть)">
                    <input type="text" id="req-type" placeholder="ТИП (например, ILL)">
                    <select id="req-list">
                        <option value="main">Main List</option>
                        <option value="ill">ILL</option>
                        <option value="ppll">PPLL</option>
                        <option value="tpll">TPLL</option>
                    </select>
                    <input type="url" id="req-showcase" placeholder="ССЫЛКА НА ВИДЕО" required>
                    <button type="submit" class="submit-btn">ОТПРАВИТЬ</button>
                </form>
            </div>

            <div id="chat-section" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>Чат с администрацией</h2>
                    <button id="delete-chat-user" style="color:red; font-size:0.6rem; background:none; border:none; cursor:pointer;">УДАЛИТЬ ЧАТ</button>
                </div>
                <div id="chat-messages"></div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="user-msg" placeholder="Сообщение...">
                    <button id="send-msg">></button>
                </div>
            </div>
            <button id="close-modal" style="background:none; border:none; color:#555; cursor:pointer; margin-top:15px; width:100%;">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script type="module" src="auth.js"></script>
    <script src="ui.js"></script>
    <script src="requests.js"></script>
    <script src="main.js"></script>
</body>
</html>
