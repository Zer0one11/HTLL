<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL List</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="levels.css">
    <link rel="stylesheet" href="modals.css">
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
</head>
<body class="theme-dark">
    <div id="snow-container"></div>

    <button id="open-request-btn" class="request-main-btn">ПОДАТЬ РЕКВЕСТ</button>
    <button id="auth-main-btn" class="request-main-btn" style="left: auto; right: 20px; display: none;">РЕГИСТРАЦИЯ</button>

    <div class="snow-ui-static">
        <label class="snow-switch">
            <input type="checkbox" id="snow-toggle" checked>
            <span class="snow-slider"></span>
        </label>
        <span class="snow-text">СНЕГ</span>
        
        <div class="settings-container" style="position: relative; display: flex; align-items: center;">
            <img src="res/setting.ico" id="settings-btn" class="setting-icon" style="margin-left: 15px;">
            
            <div id="settings-menu" class="settings-menu">
                <div id="user-profile-block" style="display: none;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="res/user.png" style="width: 32px; height: 32px; border-radius: 50%;">
                        <div>
                            <span id="user-nick-display">User</span>
                            <span id="logout-btn">Выйти</span>
                        </div>
                    </div>
                </div>

                <div class="s-control"><span>СНЕЖИНКИ</span><input type="range" id="snowSizeRange" min="2" max="25" value="5"></div>
                <div class="s-control"><span>САКУРА</span><input type="range" id="sakuraSizeRange" min="10" max="80" value="25"></div>
                <div class="s-control"><span>ПРОЗРАЧНОСТЬ</span><input type="range" id="opacityRange" min="0.01" max="0.3" step="0.01" value="0.01"></div>
                <div class="s-control-switch"><span>САКУРА</span><label class="snow-switch"><input type="checkbox" id="sakura-toggle"><span class="snow-slider"></span></label></div>
            </div>
        </div>
    </div>

    <header>
        <h1 class="main-title">HTLL LIST</h1>
        <a href="https://t.me/HardestTiktokLevelList" target="_blank" class="channel-link">Канал листа</a>
    </header>

    <div class="theme-switcher">
        <button class="theme-button" data-theme="dark">Темная</button>
        <button class="theme-button" data-theme="light">LIGHT</button>
    </div>

    <div class="list-switcher">
        <button class="list-button" data-list="levels">TPLL</button>
        <button class="list-button" data-list="ppll">PPLL</button>
        <button class="list-button" data-list="sll">SLL</button>
        <button class="list-button" data-list="ill">ILL</button>
        <button class="list-button" data-list="inf">ICLL</button>
    </div>

    <ul id="levelList" class="level-list"></ul>

    <div id="request-modal" class="modal-overlay">
        </div>

    <div id="auth-modal" class="modal-overlay">
        </div>

    <script src="script.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
