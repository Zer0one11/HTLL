<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL LIST</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="theme-dark">

    <div class="snow-ui-fixed">
        <span class="snow-text">SNOW</span>
        <label class="snow-switch">
            <input type="checkbox" id="snow-toggle" checked>
            <span class="snow-slider"></span>
        </label>
    </div>

    <header>
        <h1 class="main-title">TPLL LIST</h1>
        <div class="link-container">
            <a href="#" class="channel-link">OFFICIAL CHANNEL</a>
        </div>

        <div class="list-switcher">
            <button class="list-button active-list" data-list="levels">TPLL</button>
            <button class="list-button" data-list="ppll">PPLL</button>
            <button class="list-button" data-list="sll">SLL</button>
            <button class="list-button" data-list="ill">ILL</button>
            <button class="list-button" data-list="inf">INF</button>
            <button class="list-button" data-list="scl">SCL</button>
            <button class="list-button" data-list="icl">ICL</button>
        </div>

        <div class="theme-switcher">
            <button class="theme-button active-theme" data-theme="dark">DARK</button>
            <button class="theme-button" data-theme="light">LIGHT</button>
        </div>

        <div class="search-container">
            <input type="text" id="levelSearch" placeholder="Поиск по названию или ID...">
        </div>
    </header>

    <main>
        <ul id="levelList">
            </ul>
    </main>

    <div id="snow-container"></div>

    <script src="script.js"></script>
</body>
</html>
