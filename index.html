<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPLL List</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-blue">
    <header>
        <h1 class="main-title">TPLL LIST</h1>
        <a href="https://t.me/HardestTiktokLevelList" target="_blank" class="channel-link">Канал Листа</a>
        
        <div class="list-switcher">
            <button data-list="levels" class="list-button active-list">TPLL</button>
            <button data-list="ppll" class="list-button">PPLL</button>
            <button data-list="sll" class="list-button">SLL</button>
            <button data-list="ill" class="list-button">ILL</button>
            <button data-list="inf" class="list-button">INF</button>
        </div>
        
        <div class="theme-switcher">
            <button data-theme="blue" class="theme-button active-theme">Синяя</button>
            <button data-theme="purple" class="theme-button">Фиолетовая</button>
            <button data-theme="yellow" class="theme-button">Жёлтая</button>
            <button data-theme="green" class="theme-button">Зелёная</button>
            <button data-theme="dark" class="theme-button">Тёмная</button>
            <button data-theme="light" class="theme-button">Светлая</button>
        </div>

        <button id="adminPanelButton" class="header-button" onclick="showAdminPanel()">Админ Панель</button>

    </header>

    <main>
        <div id="adminPanelContainer" class="admin-panel-container" style="display: none;">
            </div>

        <ol id="levelList" class="level-list"></ol>
    </main>

    <script src="script.js"></script>
</body>
</
    html>
