<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* Стиль для кнопки админки, соответствующий твоему дизайну */
        .admin-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            opacity: 0.4;
            transition: 0.3s;
            cursor: pointer;
        }
        .admin-btn:hover {
            opacity: 1;
            transform: rotate(45deg);
        }
        .admin-btn img {
            width: 30px;
            height: 30px;
            filter: invert(100%) sepia(0%) saturate(0%) hue-rotate(93deg) brightness(103%) contrast(103%);
        }
    </style>
</head>
<body>
    <canvas id="snowCanvas"></canvas>

    <a href="admin.html" class="admin-btn" title="Admin Panel">
        <img src="https://www.svgrepo.com/show/433303/settings.svg" alt="Settings">
    </a>

    <header>
        <h1>HTLL</h1>
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('levels')">Main List</button>
            <button class="tab-button" onclick="showTab('ppll')">PPLL</button>
            <button class="tab-button" onclick="showTab('scl')">SCL</button>
            <button class="tab-button" onclick="showTab('ill')">ILL</button>
            <button class="tab-button" onclick="showTab('icl')">ICL</button>
            <button class="tab-button" onclick="showTab('sll')">SLL</button>
        </div>
    </header>

    <main>
        <div id="levels" class="tab-content active">
            <div id="levels-container"></div>
        </div>
        <div id="ppll" class="tab-content">
            <div id="ppll-container"></div>
        </div>
        <div id="scl" class="tab-content">
            <div id="scl-container"></div>
        </div>
        <div id="ill" class="tab-content">
            <div id="ill-container"></div>
        </div>
        <div id="icl" class="tab-content">
            <div id="icl-container"></div>
        </div>
        <div id="sll" class="tab-content">
            <div id="sll-container"></div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        // Дополнительная логика переключения табов, если она не в script.js
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            
            // Перерисовываем MathJax при смене таба
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // Инициализация снега (из твоего оригинального стиля)
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.y = -10;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 100; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
