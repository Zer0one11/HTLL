<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTLL | Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #050505; }
        .admin-container { background: rgba(20, 20, 20, 0.95); border: 1px solid #00ff00; border-radius: 10px; padding: 30px; width: 90%; max-width: 1100px; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        h1 { color: #00ff00; text-align: center; text-transform: uppercase; margin-bottom: 20px; font-size: 24px; }
        input, select { background: #111; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 5px; margin: 5px; font-family: 'Lexend', sans-serif; }
        input:focus { border-color: #00ff00; outline: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #fff; }
        th { border-bottom: 2px solid #00ff00; padding: 10px; text-align: left; color: #00ff00; }
        td { border-bottom: 1px solid #222; padding: 8px; }
        .btn { background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 10px 20px; cursor: pointer; border-radius: 5px; transition: 0.3s; font-weight: bold; }
        .btn:hover { background: #00ff00; color: #000; }
        .btn-del { border-color: #ff4444; color: #ff4444; }
        .btn-del:hover { background: #ff4444; color: #fff; }
        #editor-content { display: none; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div id="auth-section" style="text-align: center;">
            <h1>Доступ в систему</h1>
            <input type="password" id="accessCode" placeholder="Введите код...">
            <button class="btn" onclick="login()">Войти</button>
        </div>

        <div id="editor-content">
            <h1>Панель управления HTLL</h1>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <select id="fileSelect" onchange="loadData()">
                    <option value="levels.json">Main List (levels.json)</option>
                    <option value="ppll.json">PPLL</option>
                    <option value="scl.json">SCL</option>
                    <option value="ill.json">ILL</option>
                    <option value="icl.json">ICL</option>
                    <option value="sll.json">SLL</option>
                </select>
                <button class="btn" onclick="saveData()">🚀 Сохранить в GitHub</button>
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 5px; border: 1px dashed #444; margin-bottom: 20px;">
                <input type="text" id="addName" placeholder="Название">
                <input type="text" id="addCreator" placeholder="Создатель">
                <input type="text" id="addFPS" placeholder="FPS (LaTeX)">
                <input type="text" id="addID" placeholder="ID">
                <button class="btn" onclick="addLevel()">+ Добавить</button>
            </div>

            <table id="levelsTable">
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>Название</th>
                        <th>FPS (LaTeX)</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let data = [];
        const pass = "creep000";

        function login() {
            if (document.getElementById('accessCode').value === pass) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('editor-content').style.display = 'block';
                loadData();
            } else { alert("Неверный код!"); }
        }

        async function loadData() {
            const file = document.getElementById('fileSelect').value;
            const res = await fetch(`/api/update?fileName=${file}`);
            const result = await res.json();
            data = JSON.parse(result.content);
            render();
        }

        function render() {
            const body = document.getElementById('tableBody');
            body.innerHTML = '';
            data.forEach((item, i) => {
                item.number = (i + 1).toString();
                body.innerHTML += `
                    <tr>
                        <td>${item.number}</td>
                        <td><input type="text" value="${item.name}" onchange="update(${i}, 'name', this.value)"></td>
                        <td><input type="text" value="${item.fps}" onchange="update(${i}, 'fps', this.value)"></td>
                        <td><button class="btn btn-del" onclick="remove(${i})">Удалить</button></td>
                    </tr>`;
            });
        }

        function update(i, k, v) { 
            if(k === 'fps') v = v.replace(/phi/g, '\\phi').replace(/w/g, '\\omega');
            data[i][k] = v; 
        }
        function remove(i) { data.splice(i, 1); render(); }
        
        function addLevel() {
            data.push({
                number: "0",
                name: document.getElementById('addName').value,
                creator: document.getElementById('addCreator').value,
                fps: document.getElementById('addFPS').value.replace(/phi/g, '\\phi').replace(/w/g, '\\omega'),
                id: document.getElementById('addID').value,
                fv: "None", type: "None", showcase: "none"
            });
            render();
        }

        async function saveData() {
            const file = document.getElementById('fileSelect').value;
            const res = await fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: 'HELFZz', password: pass, fileName: file, newData: data })
            });
            const resData = await res.json();
            alert(resData.success ? "Успешно сохранено!" : "Ошибка: " + resData.error);
        }
    </script>
</body>
</html>
