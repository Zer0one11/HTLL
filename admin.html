<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTLL Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0a0a0b; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        h2 { grid-column: 1 / -1; text-transform: uppercase; letter-spacing: -1px; }
        
        .req-list-container { background: #111; border-radius: 20px; padding: 10px; border: 1px solid #222; height: 80vh; overflow-y: auto; }
        .admin-req-item { 
            padding: 15px; border-radius: 12px; margin-bottom: 8px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 1px solid transparent;
        }
        .admin-req-item:hover { background: #1a1a1c; }
        .admin-req-item.active { background: #fff; color: #000; }
        
        #chat-view { background: #111; border-radius: 20px; padding: 25px; border: 1px solid #222; display: none; }
        .level-info-card { background: #1a1a1c; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-left: 5px solid #fff; position: relative; }
        
        .delete-btn { position: absolute; top: 15px; right: 15px; background: #ff4444; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.7rem; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; font-size: 0.85rem; }
        .info-item b { color: #888; font-size: 0.7rem; display: block; text-transform: uppercase; }

        .chat-box { height: 300px; overflow-y: auto; background: #000; padding: 15px; border-radius: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 0.9rem; }
        .msg.admin { background: #fff; color: #000; align-self: flex-end; }
        .msg.user { background: #222; color: #fff; align-self: flex-start; }

        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; background: #1a1a1c; border: 1px solid #333; color: #fff; border-radius: 12px; outline: none; }
        .send-btn { padding: 0 25px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>HTLL Управление</h2>
    <div class="req-list-container" id="admin-req-list"></div>

    <div id="chat-view">
        <div id="level-card-admin" class="level-info-card"></div>
        <div id="admin-chat-box" class="chat-box"></div>
        <div class="input-area">
            <input type="text" id="admin-msg-input" placeholder="Напишите пользователю...">
            <button class="send-btn" id="admin-send-btn">></button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCuO6xuP2AP61bTbiqjho_jzXiDsCzxTCY",
        authDomain: "htll-request.firebaseapp.com",
        databaseURL: "https://htll-request-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "htll-request",
        appId: "1:400821777799:web:88da4772f63810f67e4f22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let activeChatId = null;

    onValue(ref(db, 'requests'), (snapshot) => {
        const list = document.getElementById('admin-req-list');
        list.innerHTML = '';
        snapshot.forEach((child) => {
            const req = child.val();
            const div = document.createElement('div');
            div.className = `admin-req-item ${activeChatId === req.id ? 'active' : ''}`;
            div.innerHTML = `<div><b>${req.level}</b><br><small>${req.nickname}</small></div>`;
            div.onclick = () => openChat(req);
            list.appendChild(div);
        });
    });

    function openChat(req) {
        activeChatId = req.id;
        document.getElementById('chat-view').style.display = 'block';
        
        document.getElementById('level-card-admin').innerHTML = `
            <button class="delete-btn" id="del-req">УДАЛИТЬ ЧАТ</button>
            <div style="font-weight:900; font-size:1.2rem;">${req.level}</div>
            <div class="info-grid">
                <div class="info-item"><b>Ник:</b> ${req.nickname}</div>
                <div class="info-item"><b>Автор:</b> ${req.creator}</div>
                <div class="info-item"><b>ID:</b> ${req.lvlId}</div>
                <div class="info-item"><b>FPS:</b> ${req.fps}</div>
                <div class="info-item"><b>Botter:</b> ${req.fv}</div>
                <div class="info-item"><b>Type:</b> ${req.type}</div>
                <div class="info-item"><b>Список:</b> ${req.list}</div>
                <div class="info-item"><b>Showcase:</b> <a href="${req.showcase}" target="_blank" style="color:#fff">Link</a></div>
            </div>
        `;

        document.getElementById('del-req').onclick = async () => {
            if(confirm("Удалить эту заявку и весь чат?")) {
                await remove(ref(db, `requests/${activeChatId}`));
                await remove(ref(db, `chats/${activeChatId}`));
                document.getElementById('chat-view').style.display = 'none';
                activeChatId = null;
            }
        };

        onValue(ref(db, `chats/${req.id}`), (snap) => {
            const chatBox = document.getElementById('admin-chat-box');
            chatBox.innerHTML = '';
            snap.forEach((mSnap) => {
                const m = mSnap.val();
                const mDiv = document.createElement('div');
                mDiv.className = `msg ${m.role}`;
                mDiv.innerText = m.text;
                chatBox.appendChild(mDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    document.getElementById('admin-send-btn').onclick = async () => {
        const inp = document.getElementById('admin-msg-input');
        if (!inp.value || !activeChatId) return;
        await push(ref(db, `chats/${activeChatId}`), { role: 'admin', text: inp.value, timestamp: Date.now() });
        await update(ref(db, `requests/${activeChatId}`), { hasUnread: true });
        inp.value = '';
    };
</script>
</body>
</html>
