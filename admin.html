<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL | Burmalda Dashboard</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://htll-request-default-rtdb.europe-west1.firebasedatabase.app https://api.github.com;">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #050505; --bg-card: rgba(255, 255, 255, 0.03); --color-text: #ffffff; --accent: #888; --border-white: rgba(255, 255, 255, 0.1); }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-main); color: var(--color-text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-tabs { display: flex; gap: 10px; width: 100%; max-width: 900px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; background: #111; border: 1px solid #222; color: #555; cursor: pointer; border-radius: 12px; font-weight: 900; text-transform: uppercase; transition: 0.3s; font-family: 'Oswald'; }
        .tab-btn.active { background: #fff; color: #000; border-color: #fff; }
        .container { width: 100%; max-width: 900px; background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
        .level-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--border-white); }
        input, select { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); border: 1px solid var(--border-white); color: #fff; padding: 12px; border-radius: 10px; outline: none; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-family: 'Oswald'; }
        .btn-primary { background: #fff; color: #000; }
        .btn-sync { background: #00ff00; color: #000; width: 100%; margin-bottom: 20px; font-weight: 900; }
        .level-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; }
        .req-container { display: flex; flex-direction: column; gap: 20px; }
        .req-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; white-space: nowrap; }
        .req-item { min-width: 150px; padding: 15px; background: #111; border: 1px solid #222; border-radius: 12px; cursor: pointer; text-align: center; }
        .req-item.active { background: #fff; color: #000; border-color: #fff; }
        .req-item.unread { border-color: #ff4444; }
        .chat-view { background: #0a0a0a; border-radius: 20px; padding: 25px; border: 1px solid #222; width: 100%; box-sizing: border-box; }
        .full-info { background: #111; padding: 20px; border-radius: 12px; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.6; border-left: 4px solid #fff; }
        .full-info b { color: #888; text-transform: uppercase; font-size: 0.7rem; display: block; }
        .chat-box { height: 300px; overflow-y: auto; background: #000; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #111; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 10px; font-size: 0.9rem; }
        .msg.admin { background: #fff; color: #000; align-self: flex-end; }
        .msg.user { background: #222; color: #fff; align-self: flex-start; }
        .logout-btn { background: none; border: 1px solid #333; color: #444; cursor: pointer; margin-bottom: 10px; font-size: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="container" style="max-width: 400px; margin-top: 100px;">
        <h1>ADMIN ACCESS</h1>
        <input type="text" id="login" placeholder="Login" autocomplete="off">
        <input type="password" id="password" placeholder="Password" style="margin-top:10px" autocomplete="new-password">
        <button class="btn btn-primary" onclick="manualLogin()" style="width: 100%; margin-top:15px">Войти</button>
    </div>

    <div id="admin-panel" style="display:none; width:100%; max-width:900px;">
        <div class="admin-tabs">
            <button id="tab-editor-btn" class="tab-btn active" onclick="switchTab('editor')">Список Уровней</button>
            <button id="tab-req-btn" class="tab-btn" onclick="switchTab('req')">Реквесты</button>
        </div>
        <button class="logout-btn" onclick="logout()">LOGOUT</button>

        <div id="section-editor" class="container">
            <select id="fileSelect" onchange="loadList()" style="margin-bottom: 15px;">
                <option value="levels.json">TPLL (Main)</option>
                <option value="ppll.json">PPLL</option>
                <option value="sll.json">SLL</option>
                <option value="ill.json">ILL</option>
                <option value="inf.json">INF</option>
                <option value="scl.json">SCL</option>
                <option value="icl.json">ICL</option>
            </select>
            <button class="btn btn-sync" onclick="saveToGitHub()">СИНХРОНИЗИРОВАТЬ С GITHUB</button>
            <div class="level-form" id="editorForm">
                <input type="hidden" id="editIndex" value="-1">
                <input type="number" id="inpNum" placeholder="Место">
                <input type="text" id="inpName" placeholder="Название">
                <input type="text" id="inpCreator" placeholder="Автор">
                <input type="text" id="inpFPS" placeholder="FPS">
                <input type="text" id="inpID" placeholder="ID">
                <input type="text" id="inpFV" placeholder="Botter">
                <input type="text" id="inpType" placeholder="Тип">
                <input type="text" id="inpShowcase" placeholder="URL">
                <button class="btn btn-primary" onclick="addOrUpdate()" style="grid-column: 1/-1;">Сохранить уровень</button>
            </div>
            <div id="listContainer"></div>
        </div>

        <div id="section-req" class="container" style="display:none;">
            <div class="req-container">
                <h3 style="margin-top:0; font-family:'Oswald';">Активные заявки</h3>
                <div class="req-list" id="fb-req-list"></div>

                <div id="fb-chat-view" class="chat-view" style="display:none;">
                    <div id="fb-full-info" class="full-info"></div>
                    <div class="chat-box" id="fb-chat-box"></div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="fb-input" placeholder="Введите ответ...">
                        <button class="btn btn-primary" id="fb-send">></button>
                    </div>
                    <button onclick="deleteCurrentChat()" style="background:none; border:none; color:#ff4444; cursor:pointer; font-size:10px; margin-top:15px; font-weight:900;">УДАЛИТЬ ЗАЯВКУ НАВСЕГДА</button>
                </div>
            </div>
        </div>
        <div id="statusMsg" style="text-align:center; margin-top:15px; font-weight:900;"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCuO6xuP2AP61bTbiqjho_jzXiDsCzxTCY",
        authDomain: "htll-request.firebaseapp.com",
        databaseURL: "https://htll-request-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "htll-request",
        appId: "1:400821777799:web:88da4772f63810f67e4f22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let activeChatId = null;

    window.switchTab = (target) => {
        document.getElementById('section-editor').style.display = target === 'editor' ? 'block' : 'none';
        document.getElementById('section-req').style.display = target === 'req' ? 'block' : 'none';
        document.getElementById('tab-editor-btn').classList.toggle('active', target === 'editor');
        document.getElementById('tab-req-btn').classList.toggle('active', target === 'req');
    };

    onValue(ref(db, 'requests'), (snapshot) => {
        const list = document.getElementById('fb-req-list');
        list.innerHTML = '';
        snapshot.forEach((child) => {
            const req = child.val();
            const div = document.createElement('div');
            div.className = `req-item ${activeChatId === req.id ? 'active' : ''} ${req.hasUnread ? 'unread' : ''}`;
            
            const b = document.createElement('b'); b.textContent = req.level;
            const br = document.createElement('br');
            const small = document.createElement('small'); small.textContent = req.nickname;
            
            div.appendChild(b); div.appendChild(br); div.appendChild(small);
            div.onclick = () => openChat(req);
            list.appendChild(div);
        });
    });

    function openChat(req) {
        activeChatId = req.id;
        document.getElementById('fb-chat-view').style.display = 'block';
        
        const infoBox = document.getElementById('fb-full-info');
        infoBox.innerHTML = ''; 

        const fields = [
            { label: 'Игрок / Ник', value: req.nickname },
            { label: 'Уровень', value: `${req.level} (by ${req.creator})` },
            { label: 'Тех. Данные', value: `ID: ${req.lvlId} | FPS: ${req.fps} | Botter: ${req.fv} | Type: ${req.type}` },
            { label: 'Список', value: req.list }
        ];

        fields.forEach(f => {
            const div = document.createElement('div');
            div.style.marginTop = '10px';
            const b = document.createElement('b'); b.textContent = f.label;
            const span = document.createElement('span'); span.textContent = ` ${f.value}`;
            div.appendChild(b); div.appendChild(span);
            infoBox.appendChild(div);
        });

        const linkDiv = document.createElement('div');
        linkDiv.style.marginTop = '10px';
        const link = document.createElement('a');
        link.href = req.showcase && req.showcase.startsWith('http') ? req.showcase : '#';
        link.target = '_blank';
        link.style.color = '#fff';
        link.textContent = 'Смотреть Showcase';
        linkDiv.appendChild(link);
        infoBox.appendChild(linkDiv);

        onValue(ref(db, `chats/${req.id}`), (snap) => {
            const box = document.getElementById('fb-chat-box');
            box.innerHTML = '';
            snap.forEach(mSnap => {
                const m = mSnap.val();
                const d = document.createElement('div');
                d.className = `msg ${m.role}`;
                d.textContent = m.text;
                box.appendChild(d);
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    document.getElementById('fb-send').onclick = async () => {
        const inp = document.getElementById('fb-input');
        if(!inp.value || !activeChatId) return;
        await push(ref(db, `chats/${activeChatId}`), { role: 'admin', text: inp.value, timestamp: Date.now() });
        await update(ref(db, `requests/${activeChatId}`), { hasUnread: true });
        inp.value = '';
    };

    window.deleteCurrentChat = async () => {
        if(confirm("Удалить всё?")) {
            await remove(ref(db, `requests/${activeChatId}`));
            await remove(ref(db, `chats/${activeChatId}`));
            document.getElementById('fb-chat-view').style.display = 'none';
            activeChatId = null;
        }
    };
</script>

<script>
    let currentData = [];
    let sessionUser = "", sessionPass = "";
    
    window.onload = () => { 
        const u = localStorage.getItem('at_u'), p = localStorage.getItem('at_p'); 
        if (u && p) checkAuth(u, p, true); 
    };

    function manualLogin() { checkAuth(document.getElementById('login').value, document.getElementById('password').value, false); }
    function logout() { localStorage.clear(); location.reload(); }

    async function checkAuth(l, p, isAuto) {
        try {
            const res = await fetch('./api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'verify', login: l, password: p })
            });
            
            if (res.ok) {
                sessionUser = l; sessionPass = p;
                localStorage.setItem('at_u', l); localStorage.setItem('at_p', p);
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadList();
            } else {
                if (!isAuto) alert("Ошибка доступа: Неверные данные");
                logout();
            }
        } catch (err) {
            if (!isAuto) alert("Ошибка авторизации на сервере");
        }
    }

    async function loadList() {
        const status = document.getElementById('statusMsg'); status.innerText = "ЗАГРУЗКА...";
        try {
            const res = await fetch(`./api/update?fileName=${document.getElementById('fileSelect').value}`);
            if (res.status === 401) { logout(); return; }
            const result = await res.json();
            currentData = JSON.parse(result.content);
            status.innerText = ""; render();
        } catch(e) { status.innerText = "ОШИБКА FETCH"; }
    }

    function render() {
        const container = document.getElementById('listContainer'); container.innerHTML = '';
        currentData.sort((a,b)=>parseInt(a.number)-parseInt(b.number));
        currentData.forEach((item, i) => {
            const row = document.createElement('div'); row.className = 'level-row';
            row.onclick = () => editLevel(i);
            
            const txt = document.createElement('div');
            const b = document.createElement('b'); b.textContent = `#${item.number} `;
            txt.appendChild(b); txt.appendChild(document.createTextNode(item.name));
            
            const del = document.createElement('button');
            del.className = 'btn';
            del.style = 'background:#ff4444; padding:5px; font-size:10px';
            del.textContent = 'X';
            del.onclick = (e) => { e.stopPropagation(); deleteLevel(i); };
            
            row.appendChild(txt); row.appendChild(del);
            container.appendChild(row);
        });
    }

    function addOrUpdate() {
        const idx = parseInt(document.getElementById('editIndex').value);
        const newNum = parseInt(document.getElementById('inpNum').value);
        const level = {
            number: newNum.toString(), name: document.getElementById('inpName').value,
            creator: document.getElementById('inpCreator').value, fps: document.getElementById('inpFPS').value,
            id: document.getElementById('inpID').value, fv: document.getElementById('inpFV').value,
            type: document.getElementById('inpType').value, showcase: document.getElementById('inpShowcase').value
        };
        if (idx !== -1) currentData.splice(idx, 1);
        currentData.forEach(item => { if (parseInt(item.number) >= newNum) item.number = (parseInt(item.number) + 1).toString(); });
        currentData.push(level); 
        resetForm(); render();
    }

    function editLevel(i) {
        const item = currentData[i]; document.getElementById('editIndex').value = i;
        document.getElementById('inpNum').value = item.number; document.getElementById('inpName').value = item.name;
        document.getElementById('inpCreator').value = item.creator; document.getElementById('inpFPS').value = item.fps;
        document.getElementById('inpID').value = item.id; document.getElementById('inpFV').value = item.fv;
        document.getElementById('inpType').value = item.type; document.getElementById('inpShowcase').value = item.showcase;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() { document.getElementById('editIndex').value="-1"; document.querySelectorAll('#editorForm input').forEach(i=>i.value=""); }

    async function saveToGitHub() {
        const status = document.getElementById('statusMsg'); status.innerText = "СОХРАНЕНИЕ...";
        const res = await fetch('./api/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'save', login: sessionUser, password: sessionPass, fileName: document.getElementById('fileSelect').value, newData: currentData })
        });
        if (res.status === 401) { alert("Доступ отклонен бэкендом"); logout(); return; }
        const result = await res.json();
        status.innerText = result.success ? "ГОТОВО!" : "ОШИБКА!";
        setTimeout(() => status.innerText = "", 3000);
    }

    function deleteLevel(i) { if (confirm("Удалить?")) { currentData.splice(i, 1); render(); } }
</script>
</body>
</html>
