<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTLL | Master Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: rgba(255, 255, 255, 0.03);
            --color-text: #ffffff;
            --accent: #888;
            --border-white: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-main); color: var(--color-text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; background: var(--bg-card); backdrop-filter: blur(12px); border-radius: 20px; padding: 30px; border: 1px solid var(--border-white); margin-top: 20px; box-sizing: border-box; }
        
        /* ВКЛАДКИ */
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 1000px; }
        .tab-btn { flex: 1; padding: 15px; background: #111; border: 1px solid #222; color: #555; cursor: pointer; border-radius: 12px; font-weight: 900; text-transform: uppercase; transition: 0.3s; }
        .tab-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* РЕДАКТОР УРОВНЕЙ */
        .level-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--border-white); }
        input, select { background: rgba(0,0,0,0.5); border: 1px solid var(--border-white); color: #fff; padding: 12px; border-radius: 10px; outline: none; width: 100%; box-sizing: border-box; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-family: 'Oswald'; transition: 0.3s; }
        .btn-primary { background: #fff; color: #000; }
        .btn-sync { background: #00ff00; color: #000; width: 100%; margin-bottom: 20px; font-weight: 900; }
        .level-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; }
        .level-row:hover { border-color: #555; }

        /* ЧАТЫ И ЗАЯВКИ */
        .chats-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; display: none; }
        .req-list { background: #111; border-radius: 15px; padding: 10px; height: 600px; overflow-y: auto; border: 1px solid #222; }
        .req-item { padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; font-size: 0.8rem; }
        .req-item:hover { background: #1a1a1c; }
        .req-item.active { background: #fff; color: #000; }
        .chat-view { background: #111; border-radius: 15px; padding: 20px; border: 1px solid #222; position: relative; }
        .chat-box { height: 350px; overflow-y: auto; background: #000; border-radius: 12px; padding: 15px; margin: 15px 0; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 0.9rem; }
        .msg.admin { background: #fff; color: #000; align-self: flex-end; }
        .msg.user { background: #222; color: #fff; align-self: flex-start; }
        .delete-chat-btn { position: absolute; top: 20px; right: 20px; background: #ff4444; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; }

        #auth-screen { margin-top: 100px; text-align: center; }
        #admin-panel { display: none; width: 100%; }
        .logout-btn { background: none; border: 1px solid #333; color: #555; padding: 5px 10px; cursor: pointer; border-radius: 5px; margin-bottom: 10px; font-size: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="container" style="max-width: 400px;">
        <h1>ADMIN ACCESS</h1>
        <input type="text" id="login" placeholder="Login" style="margin-bottom: 10px;">
        <input type="password" id="password" placeholder="Password" style="margin-bottom: 15px;">
        <button class="btn btn-primary" onclick="manualLogin()" style="width: 100%;">Войти</button>
    </div>

    <div id="admin-panel">
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('editor')">Редактор уровней</button>
            <button class="tab-btn" onclick="switchTab('chats')">Заявки и Чаты</button>
        </div>
        <button class="logout-btn" onclick="logout()">ВЫЙТИ</button>

        <div id="tab-editor" class="container">
            <select id="fileSelect" onchange="loadList()" style="margin-bottom: 15px;">
                <option value="levels.json">TPLL (Main)</option>
                <option value="ppll.json">PPLL</option>
                <option value="sll.json">SLL</option>
                <option value="ill.json">ILL</option>
                <option value="inf.json">INF</option>
                <option value="scl.json">SCL</option>
                <option value="icl.json">ICL</option>
            </select>
            <button class="btn btn-sync" onclick="saveToGitHub()">СИНХРОНИЗИРОВАТЬ НА GITHUB</button>

            <h3 id="formTitle" style="text-align: center; margin-top:0;">Добавить уровень</h3>
            <div class="level-form" id="editorForm">
                <input type="hidden" id="editIndex" value="-1">
                <input type="number" id="inpNum" placeholder="№">
                <input type="text" id="inpName" placeholder="Название">
                <input type="text" id="inpCreator" placeholder="Автор">
                <input type="text" id="inpFPS" placeholder="FPS">
                <input type="text" id="inpID" placeholder="ID">
                <input type="text" id="inpFV" placeholder="Botter">
                <input type="text" id="inpType" placeholder="Тип">
                <input type="text" id="inpShowcase" placeholder="URL">
                <button class="btn btn-primary" onclick="addOrUpdate()" style="grid-column: 1/-1">Применить</button>
            </div>
            <div id="listContainer"></div>
        </div>

        <div id="tab-chats" class="container chats-layout">
            <div class="req-list" id="fb-req-list"></div>
            <div class="chat-view" id="fb-chat-view" style="display: none;">
                <button class="delete-chat-btn" id="fb-del-btn">УДАЛИТЬ ЧАТ</button>
                <div id="fb-level-info" style="font-size: 0.8rem; line-height: 1.4; border-bottom: 1px solid #333; padding-bottom: 10px;"></div>
                <div class="chat-box" id="fb-chat-box"></div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="fb-input" placeholder="Ответить пользователю...">
                    <button class="btn btn-primary" id="fb-send" style="width: 60px;">></button>
                </div>
            </div>
        </div>
        <div id="statusMsg" class="status-msg" style="text-align: center; margin-top: 10px; font-weight: 900;"></div>
    </div>

<script type="module">
    // Инициализация Firebase для таба Чатов
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCuO6xuP2AP61bTbiqjho_jzXiDsCzxTCY",
        authDomain: "htll-request.firebaseapp.com",
        databaseURL: "https://htll-request-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "htll-request",
        appId: "1:400821777799:web:88da4772f63810f67e4f22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let activeChatId = null;

    // Загрузка заявок из Firebase
    onValue(ref(db, 'requests'), (snapshot) => {
        const list = document.getElementById('fb-req-list');
        list.innerHTML = '';
        snapshot.forEach((child) => {
            const req = child.val();
            const div = document.createElement('div');
            div.className = `req-item ${activeChatId === req.id ? 'active' : ''}`;
            div.innerHTML = `<b>${req.level}</b><br>${req.nickname} ${req.hasUnread ? '🔴' : ''}`;
            div.onclick = () => openFirebaseChat(req);
            list.appendChild(div);
        });
    });

    function openFirebaseChat(req) {
        activeChatId = req.id;
        document.getElementById('fb-chat-view').style.display = 'block';
        document.getElementById('fb-level-info').innerHTML = `
            <b>УРОВЕНЬ:</b> ${req.level} | <b>НИК:</b> ${req.nickname}<br>
            <b>ID:</b> ${req.lvlId} | <b>FPS:</b> ${req.fps} | <b>BOTTER:</b> ${req.fv}<br>
            <b>LINK:</b> <a href="${req.showcase}" target="_blank" style="color:#fff">${req.showcase}</a>
        `;

        onValue(ref(db, `chats/${req.id}`), (snap) => {
            const box = document.getElementById('fb-chat-box');
            box.innerHTML = '';
            snap.forEach(mSnap => {
                const m = mSnap.val();
                const d = document.createElement('div');
                d.className = `msg ${m.role}`;
                d.innerText = m.text;
                box.appendChild(d);
            });
            box.scrollTop = box.scrollHeight;
        });

        document.getElementById('fb-del-btn').onclick = async () => {
            if(confirm("Удалить заявку и чат?")) {
                await remove(ref(db, `requests/${req.id}`));
                await remove(ref(db, `chats/${req.id}`));
                document.getElementById('fb-chat-view').style.display = 'none';
            }
        };
    }

    document.getElementById('fb-send').onclick = async () => {
        const inp = document.getElementById('fb-input');
        if(!inp.value || !activeChatId) return;
        await push(ref(db, `chats/${activeChatId}`), { role: 'admin', text: inp.value, timestamp: Date.now() });
        await update(ref(db, `requests/${activeChatId}`), { hasUnread: true });
        inp.value = '';
    };

    window.switchTab = (tab) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('tab-editor').style.display = tab === 'editor' ? 'block' : 'none';
        document.getElementById('tab-chats').style.display = tab === 'chats' ? 'grid' : 'none';
    };
</script>

<script>
    // ТВОЯ ЛОГИКА РЕДАКТОРА УРОВНЕЙ (GITHUB)
    let currentData = [];
    let sessionUser = "";
    let sessionPass = "";
    const USERS = [
        { user: 'HELFZz', pass: 'creep000' },
        { user: 'Curruser54', pass: '546111' },
        { user: 'ByHanseLLL', pass: '11540hanse' },
        { user: 'decidableset043', pass: 'hellonigga1991' }
    ];

    window.onload = () => {
        const u = localStorage.getItem('at_u'), p = localStorage.getItem('at_p');
        if (u && p) checkAuth(u, p, true);
    };

    function manualLogin() { checkAuth(document.getElementById('login').value, document.getElementById('password').value, false); }
    function logout() { localStorage.clear(); location.reload(); }

    function checkAuth(l, p, isAuto) {
        const found = USERS.find(u => u.user === l && u.pass === p);
        if (found) {
            sessionUser = l; sessionPass = p;
            localStorage.setItem('at_u', l); localStorage.setItem('at_p', p);
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadList();
        } else if (!isAuto) alert("Ошибка доступа");
    }

    async function loadList() {
        const status = document.getElementById('statusMsg');
        status.innerText = "ЗАГРУЗКА...";
        try {
            const res = await fetch(`/api/update?fileName=${document.getElementById('fileSelect').value}`);
            const result = await res.json();
            currentData = JSON.parse(result.content);
            status.innerText = "";
            render();
        } catch(e) { status.innerText = "ОШИБКА ЗАГРУЗКИ"; }
    }

    function render() {
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        currentData.sort((a, b) => parseInt(a.number) - parseInt(b.number));
        currentData.forEach((item, i) => {
            const row = document.createElement('div');
            row.className = 'level-row';
            row.onclick = () => editLevel(i);
            row.innerHTML = `<div><b>#${item.number}</b> ${item.name} <small>by ${item.creator}</small></div>
                             <button class="btn" style="background:#ff4444; padding:5px 10px; font-size:10px;" onclick="deleteLevel(event, ${i})">УДАЛИТЬ</button>`;
            container.appendChild(row);
        });
    }

    function addOrUpdate() {
        const idx = parseInt(document.getElementById('editIndex').value);
        const newNum = parseInt(document.getElementById('inpNum').value);
        const level = {
            number: newNum.toString(),
            name: document.getElementById('inpName').value,
            creator: document.getElementById('inpCreator').value,
            fps: document.getElementById('inpFPS').value,
            id: document.getElementById('inpID').value,
            fv: document.getElementById('inpFV').value,
            type: document.getElementById('inpType').value,
            showcase: document.getElementById('inpShowcase').value
        };
        if (idx !== -1) currentData.splice(idx, 1);
        currentData.forEach(item => { if (parseInt(item.number) >= newNum) item.number = (parseInt(item.number) + 1).toString(); });
        currentData.push(level);
        resetForm(); render();
    }

    function editLevel(i) {
        const item = currentData[i];
        document.getElementById('editIndex').value = i;
        document.getElementById('inpNum').value = item.number;
        document.getElementById('inpName').value = item.name;
        document.getElementById('inpCreator').value = item.creator;
        document.getElementById('inpFPS').value = item.fps;
        document.getElementById('inpID').value = item.id;
        document.getElementById('inpFV').value = item.fv;
        document.getElementById('inpType').value = item.type;
        document.getElementById('inpShowcase').value = item.showcase;
        document.getElementById('formTitle').innerText = "Изменение уровня #" + item.number;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() { document.getElementById('editIndex').value = "-1"; document.querySelectorAll('#editorForm input').forEach(i => i.value = ""); }
    function deleteLevel(e, i) { e.stopPropagation(); if (confirm("Удалить?")) { currentData.splice(i, 1); render(); } }

    async function saveToGitHub() {
        const status = document.getElementById('statusMsg');
        status.innerText = "СОХРАНЕНИЕ...";
        const res = await fetch('/api/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login: sessionUser, password: sessionPass, fileName: document.getElementById('fileSelect').value, newData: currentData })
        });
        const result = await res.json();
        status.innerText = result.success ? "ГОТОВО!" : "ОШИБКА!";
        setTimeout(() => status.innerText = "", 3000);
    }
</script>
</body>
</html>
