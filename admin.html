<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTLL | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat'; background: #050505; color: #fff; padding: 20px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .box { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .req-card { background: #111; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #888; cursor: pointer; }
        .req-card:hover { background: #1a1a1a; }
        #admin-chat-box { height: 300px; overflow-y: auto; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="admin-grid">
        <div class="box">
            <h2>ВХОДЯЩИЕ РЕКВЕСТЫ</h2>
            <div id="requests-list"></div>
        </div>

        <div class="box" id="chat-admin-panel" style="display:none;">
            <h2 id="current-chat-name">ЧАТ</h2>
            <div id="admin-chat-box"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="admin-reply" placeholder="Ответить..." style="flex:1; padding:10px; border-radius:10px; background:#1a1a1a; color:#fff; border:1px solid #333;">
                <button id="admin-send-btn" style="padding:10px 20px; border-radius:10px; border:none; background:#fff; font-weight:900; cursor:pointer;">ОТПРАВИТЬ</button>
            </div>
            <br>
            <button onclick="closeRequest()" style="background: red; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer;">ЗАКРЫТЬ РЕКВЕСТ (УДАЛИТЬ)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuO6xuP2AP61bTbiqjho_jzXiDsCzxTCY",
            authDomain: "htll-request.firebaseapp.com",
            databaseURL: "https://htll-request-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "htll-request",
            appId: "1:400821777799:web:88da4772f63810f67e4f22"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let activeId = null;

        // Загрузка заявок
        onValue(ref(db, 'requests'), (snapshot) => {
            const list = document.getElementById('requests-list');
            list.innerHTML = '';
            const data = snapshot.val();
            for (let id in data) {
                const r = data[id];
                const card = document.createElement('div');
                card.className = 'req-card';
                card.innerHTML = `<strong>${r.nickname}</strong><br>${r.level} [${r.list}]`;
                card.onclick = () => openChat(id, r.nickname);
                list.appendChild(card);
            }
        });

        window.openChat = (id, name) => {
            activeId = id;
            document.getElementById('chat-admin-panel').style.display = 'block';
            document.getElementById('current-chat-name').innerText = "ЧАТ С: " + name;
            
            const chatBox = document.getElementById('admin-chat-box');
            onValue(ref(db, `chats/${id}`), (snap) => {
                chatBox.innerHTML = '';
                const msgs = snap.val();
                for (let mId in msgs) {
                    const m = msgs[mId];
                    const div = document.createElement('div');
                    div.style.color = m.role === 'admin' ? '#fff' : '#aaa';
                    div.innerHTML = `<strong>${m.role === 'admin' ? 'МЫ' : 'ИГРОК'}:</strong> ${m.text}`;
                    chatBox.appendChild(div);
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        };

        document.getElementById('admin-send-btn').onclick = () => {
            const inp = document.getElementById('admin-reply');
            if(!inp.value || !activeId) return;
            push(ref(db, `chats/${activeId}`), { role: 'admin', text: inp.value, time: Date.now() });
            inp.value = '';
        };

        window.closeRequest = () => {
            if(confirm("Удалить реквест и чат?")) {
                remove(ref(db, `requests/${activeId}`));
                remove(ref(db, `chats/${activeId}`));
                document.getElementById('chat-admin-panel').style.display = 'none';
            }
        };
    </script>
</body>
</html>
