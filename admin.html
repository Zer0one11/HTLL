<div id="tab-requests" class="section">
    <div class="container" style="max-width: 600px;">
        <h3>ВХОДЯЩИЕ РЕКВЕСТЫ</h3>
        <div id="admin-req-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px; border-bottom: 1px solid #333;"></div>
        
        <div id="chat-view" style="display:none;">
            <div id="level-card-admin" style="background: #1a1a1c; padding: 15px; border-radius: 15px; margin-bottom: 15px; border-left: 4px solid #fff;">
                </div>
            <div id="admin-chat-box" class="chat-box" style="height: 250px;"></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="admin-msg" placeholder="Ответить...">
                <button onclick="sendMsg()" style="padding:10px 20px; background:#fff; border:none; border-radius:10px; font-weight:900;">></button>
            </div>
        </div>
    </div>
</div>

<script>
// В функции openChat добавь обновление карточки:
function openChat(id, data) {
    activeId = id;
    document.getElementById('chat-view').style.display = 'block';
    
    // Скидываем данные уровня админу перед чатом
    document.getElementById('level-card-admin').innerHTML = `
        <div style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 5px;">ДАННЫЕ УРОВНЯ:</div>
        <div style="font-weight: 900; font-size: 1.1rem;">${data.level}</div>
        <div style="font-size: 0.9rem; margin-bottom: 10px;">by ${data.creator}</div>
        <div style="font-size: 0.8rem; line-height: 1.4;">
            <b>ID:</b> ${data.lvlId}<br>
            <b>FPS:</b> ${data.fps}<br>
            <b>FV:</b> ${data.fv}<br>
            <b>TYPE:</b> ${data.type}<br>
            <a href="${data.showcase}" target="_blank" style="color:#aaa; text-decoration:underline;">Showcase Link</a>
        </div>
    `;
    
    // Дальше стандартная загрузка сообщений...
    const { ref, onValue } = window.fdb;
    onValue(ref(window.fdb.db, `chats/${id}`), (snap) => {
        // ... твой код отображения сообщений
    });
}
</script>
