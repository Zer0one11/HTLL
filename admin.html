<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HTLL Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0a0a0b; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h2 { text-transform: uppercase; letter-spacing: -1px; }
        
        /* Список входящих сверху */
        .req-list-container { 
            background: #111; border-radius: 20px; padding: 20px; 
            margin-bottom: 30px; border: 1px solid #222;
        }
        .admin-req-item { 
            padding: 15px; border-bottom: 1px solid #222; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .admin-req-item:hover { background: #1a1a1c; }
        .admin-req-item.active { border-left: 4px solid #fff; background: #1a1a1c; }
        
        /* Чат и инфо снизу */
        #chat-view { 
            display: none; background: #111; border-radius: 20px; padding: 25px;
            border: 1px solid #222;
        }
        .level-info-card {
            background: #1a1a1c; padding: 20px; border-radius: 15px;
            margin-bottom: 20px; border-left: 5px solid #fff;
        }
        .chat-box { 
            height: 300px; overflow-y: auto; background: #000; 
            padding: 15px; border-radius: 15px; margin-bottom: 15px;
        }
        .msg { margin-bottom: 10px; max-width: 80%; padding: 10px; border-radius: 10px; }
        .msg.admin { background: #333; margin-left: auto; text-align: right; }
        .msg.user { background: #222; }

        input { 
            width: 100%; padding: 15px; background: #1a1a1c; border: 1px solid #333;
            color: #fff; border-radius: 12px; box-sizing: border-box;
        }
        button.send-btn {
            margin-top: 10px; width: 100%; padding: 15px; background: #fff;
            color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Входящие реквесты</h2>
    <div class="req-list-container" id="admin-req-list">
        </div>

    <div id="chat-view">
        <div id="level-card-admin" class="level-info-card"></div>
        <div id="admin-chat-box" class="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="admin-msg-input" placeholder="Напишите ответ...">
            <button class="send-btn" id="admin-send-btn">ОТПРАВИТЬ СООБЩЕНИЕ</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCuO6xuP2AP61bTbiqjho_jzXiDsCzxTCY",
        authDomain: "htll-request.firebaseapp.com",
        databaseURL: "https://htll-request-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "htll-request",
        appId: "1:400821777799:web:88da4772f63810f67e4f22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let activeChatId = null;

    // Загрузка списка реквестов
    onValue(ref(db, 'requests'), (snapshot) => {
        const list = document.getElementById('admin-req-list');
        list.innerHTML = '';
        snapshot.forEach((child) => {
            const req = child.val();
            const div = document.createElement('div');
            div.className = `admin-req-item ${activeChatId === req.id ? 'active' : ''}`;
            div.innerHTML = `<div><b>${req.level}</b><br><small>${req.nickname}</small></div><span>${req.list}</span>`;
            div.onclick = () => openChat(req);
            list.appendChild(div);
        });
    });

    function openChat(req) {
        activeChatId = req.id;
        document.getElementById('chat-view').style.display = 'block';
        
        // Карточка данных
        document.getElementById('level-card-admin').innerHTML = `
            <div style="font-size:0.7rem; opacity:0.5; margin-bottom:5px;">ДАННЫЕ ЗАЯВКИ:</div>
            <div style="font-size:1.2rem; font-weight:900;">${req.level} by ${req.creator}</div>
            <div style="font-size:0.8rem; margin-top:10px; line-height:1.6;">
                ID: ${req.lvlId} | FPS: ${req.fps}<br>
                FV: ${req.fv} | TYPE: ${req.type}<br>
                <a href="${req.showcase}" target="_blank" style="color:#fff;">ОТКРЫТЬ ВИДЕО</a>
            </div>
        `;

        // Загрузка сообщений
        const chatBox = document.getElementById('admin-chat-box');
        onValue(ref(db, `chats/${req.id}`), (snap) => {
            chatBox.innerHTML = '';
            snap.forEach((mSnap) => {
                const m = mSnap.val();
                const mDiv = document.createElement('div');
                mDiv.className = `msg ${m.role}`;
                mDiv.innerHTML = `<small style="display:block; opacity:0.5;">${m.role === 'admin' ? 'MOD' : 'USER'}</small>${m.text}`;
                chatBox.appendChild(mDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    // Отправка
    document.getElementById('admin-send-btn').onclick = () => {
        const inp = document.getElementById('admin-msg-input');
        if (!inp.value || !activeChatId) return;
        push(ref(db, `chats/${activeChatId}`), {
            role: 'admin',
            text: inp.value,
            timestamp: Date.now()
        });
        inp.value = '';
    };
</script>
</body>
</html>
